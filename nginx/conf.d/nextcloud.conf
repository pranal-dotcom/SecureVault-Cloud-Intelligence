upstream nextcloud_backend {
    server nextcloud:80;
    keepalive 32;
}

upstream ai_backend {
    server ai-service:8000;
    keepalive 16;
}

# ==============================================================================
# OWASP Exploit Pattern Detection Maps (WAF Inspection Engine)
# Supports both decoded and URL-encoded (%20, +, etc.) payloads
# ==============================================================================

# 1. SQL Injection (SQLi) Detection Map
map $request_uri $waf_sqli_uri {
    default 0;
    "~*(union(\s+|%20|\+)+(all(\s+|%20|\+)+)?select|insert(\s+|%20|\+)+into|delete(\s+|%20|\+)+from|drop(\s+|%20|\+)+table|sleep\s*\(|or(\s+|%20|\+)+1(\s+|%20|\+)*=(\s+|%20|\+)*1|'(\s+|%20|\+)*or(\s+|%20|\+)*'|--|benchmark\s*\(|load_file\s*\()" 1;
}
map $query_string $waf_sqli_query {
    default 0;
    "~*(union(\s+|%20|\+)+(all(\s+|%20|\+)+)?select|insert(\s+|%20|\+)+into|delete(\s+|%20|\+)+from|drop(\s+|%20|\+)+table|sleep\s*\(|or(\s+|%20|\+)+1(\s+|%20|\+)*=(\s+|%20|\+)*1|'(\s+|%20|\+)*or(\s+|%20|\+)*'|--|benchmark\s*\(|load_file\s*\()" 1;
}

# 2. Cross-Site Scripting (XSS) Detection Map
map $request_uri $waf_xss_uri {
    default 0;
    "~*(<script|%3cscript|javascript:|vbscript:|onerror(\s+|%20|\+)*=|onload(\s+|%20|\+)*=|onclick(\s+|%20|\+)*=|alert\s*\(|document\.cookie|<iframe|%3ciframe|<img|%3cimg)" 1;
}
map $query_string $waf_xss_query {
    default 0;
    "~*(<script|%3cscript|javascript:|vbscript:|onerror(\s+|%20|\+)*=|onload(\s+|%20|\+)*=|onclick(\s+|%20|\+)*=|alert\s*\(|document\.cookie|<iframe|%3ciframe|<img|%3cimg)" 1;
}

# 3. Path Traversal & Sensitive File Inspection Map
map $request_uri $waf_traversal {
    default 0;
    "~*(\.\./|\.\.\\|%2e%2e|etc/passwd|etc/shadow|\.env|\.git|\.htaccess|\.aws|\.ssh|web\.config|\.bak|\.sql)" 1;
}

# HTTP - Redirect all traffic to HTTPS (with ACME challenge support for Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME-challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Nextcloud Secure Reverse Proxy with Perimeter Defense, WAF & AI API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL Certificates (mkcert Local CA Trusted)
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # SSL Hardening Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern Perimeter Defense & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Nextcloud Large File Upload Optimization
    client_max_body_size 10G;
    client_body_timeout 300s;
    fastcgi_buffers 64 4K;

    # ==========================================================================
    # Custom 403 Forbidden Error Page (SecureVault WAF)
    # ==========================================================================
    error_page 403 /403.html;

    location = /403.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ==========================================================================
    # Interactive Web Frontend Dashboard Route
    # ==========================================================================
    location /dashboard {
        # WAF Rules
        if ($waf_sqli_uri) { return 403; }
        if ($waf_sqli_query) { return 403; }
        if ($waf_xss_uri) { return 403; }
        if ($waf_xss_query) { return 403; }
        if ($waf_traversal) { return 403; }

        proxy_pass http://ai_backend/dashboard;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ==========================================================================
    # Autonomous AI Document Intelligence Engine Endpoint
    # ==========================================================================
    location /ai-api/ {
        # WAF Rules for AI API
        if ($waf_sqli_uri) { return 403; }
        if ($waf_sqli_query) { return 403; }
        if ($waf_xss_uri) { return 403; }
        if ($waf_xss_query) { return 403; }
        if ($waf_traversal) { return 403; }

        proxy_pass http://ai_backend/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Prefix /ai-api;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;

        client_max_body_size 50M;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Nextcloud CalDAV / CardDAV Auto-Discovery Redirects
    location ^~ /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }

    location ^~ /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }

    location ^~ /.well-known/webfinger {
        return 301 $scheme://$host/index.php/.well-known/webfinger;
    }

    location ^~ /.well-known/nodeinfo {
        return 301 $scheme://$host/index.php/.well-known/nodeinfo;
    }

    # Sensitive Login Endpoints - Strict Rate Limiting & WAF
    location ~* ^/(login|index\.php/login) {
        # WAF Rules
        if ($waf_sqli_uri) { return 403; }
        if ($waf_sqli_query) { return 403; }
        if ($waf_xss_uri) { return 403; }
        if ($waf_xss_query) { return 403; }
        if ($waf_traversal) { return 403; }

        limit_req zone=login_req_limit burst=3 nodelay;

        proxy_pass http://nextcloud_backend;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Whitelist Nextcloud Static Assets (Bypass general_req_limit to prevent HTTP 429 and blank UI)
    location ~* \.(?:css|js|mjs|svg|gif|png|jpg|ico|wasm|tflite|map|ogg|flac|woff|woff2|ttf|eot)$ {
        proxy_pass http://nextcloud_backend;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ==========================================================================
    # Landing Page Route (Overrides Nextcloud Root)
    # ==========================================================================
    location = / {
        # WAF Rules
        if ($waf_sqli_uri) { return 403; }
        if ($waf_sqli_query) { return 403; }
        if ($waf_xss_uri) { return 403; }
        if ($waf_xss_query) { return 403; }
        if ($waf_traversal) { return 403; }

        proxy_pass http://ai_backend/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Main Proxy Pass to Nextcloud Apache with WAF & Rate Limiting
    location / {
        # WAF Rules
        if ($waf_sqli_uri) { return 403; }
        if ($waf_sqli_query) { return 403; }
        if ($waf_xss_uri) { return 403; }
        if ($waf_xss_query) { return 403; }
        if ($waf_traversal) { return 403; }

        limit_req zone=general_req_limit burst=20 nodelay;

        proxy_pass http://nextcloud_backend;

        # Standard Proxy Headers
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;

        # WebDAV & Chunked Upload Settings
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
